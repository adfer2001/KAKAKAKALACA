<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos</title>
<link rel="apple-touch-icon" id="ic">
<style>
:root{--bg:#eef1f4;--c:#fff;--t:#14211c;--s:#66727c;--a:#0b6b50;--r:#c62828;--l:#dde3e8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f0e;--c:#17201d;--t:#eef4f1;--s:#92a09a;--a:#3ecf9e;--r:#ff7a70;--l:#26332e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.35 -apple-system,system-ui,"Helvetica Neue",sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:14px 16px}
h1{font-size:30px;letter-spacing:-.02em;margin:8px 0 14px}
h2{font-size:15px;font-weight:700;margin:22px 4px 8px}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}
input,select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);margin-bottom:8px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
#amt{font-size:44px;font-weight:700;text-align:center;border:0;background:none;letter-spacing:-.03em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:10px 14px;border-radius:20px;border:2px solid var(--cc);background:none;color:var(--t);font:inherit;font-weight:600}
.chip.on{background:var(--cc);color:#fff}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--a);color:var(--c);font:inherit;font-weight:700;font-size:17px}
.btn.g{background:var(--l);color:var(--t);padding:11px;font-size:15px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}
.row:last-child{border:0}
.s{color:var(--s);font-size:13px}.b{font-weight:600}.r{color:var(--r)}
.seg{display:flex;background:var(--l);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border:0;border-radius:8px;background:none;color:var(--t);font:inherit;font-size:14px}
.seg .on{background:var(--c);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 7px;border:0;background:none;color:var(--s);font:inherit;font-size:11px}
nav button.on{color:var(--a);font-weight:700}
nav i{display:block;font-size:22px;font-style:normal}
.bar{height:6px;border-radius:3px;margin-top:4px}
.x{border:0;background:none;color:var(--s);font-size:18px;padding:4px 0 4px 10px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--a);color:var(--c);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600;z-index:9}
#toast.on{opacity:1}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
textarea{width:100%;height:90px;font:12px monospace;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);padding:8px}
.f{display:flex;gap:8px}.f>*{flex:1}
label.s{display:block;margin:2px 2px 4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{aspect-ratio:1.586;border:0;border-radius:10px;position:relative;color:#fff;font:inherit;font-weight:700;font-size:11px;text-align:left;padding:0;overflow:hidden;opacity:.5;transition:opacity .15s}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.tile.on{opacity:1;outline:3px solid var(--a);outline-offset:2px}
.sm{width:auto!important;padding:8px 16px!important;margin:0!important;font-size:14px!important}
.pill{border:1px solid var(--a);color:var(--a);background:none;border-radius:12px;font:inherit;font-size:12px;padding:3px 10px;margin-top:4px}
.btn,.pill,.tile{transition:transform .08s,opacity .15s}.btn:active,.pill:active,.tile:active{transform:scale(.97)}
</style></head><body>
<main></main><div id="toast"></div>
<nav>
<button data-t="home"><i>＋</i>Gasto</button>
<button data-t="rev"><i>📊</i>Revisar</button>
<button data-t="msi"><i>💳</i>MSI</button>
<button data-t="rec"><i>🔁</i>Fijos</button>
<button data-t="sal"><i>💚</i>Salud</button>
<button data-t="cfg"><i>⚙️</i>Ajustes</button>
</nav>
<script>
const $=s=>document.querySelector(s),K='gastos_v1';
const defCards=[{id:'didi',n:'DIDI Card',cut:26,pay:15,c:'#e8590c'},{id:'amex',n:'Amex Platinum',cut:27,pay:20,c:'#7c8a94'},{id:'open',n:'Openbank',cut:13,pay:20,c:'#1c64f2'},{id:'bnx',n:'Banamex',cut:19,pay:20,c:'#1f3470'},{id:'cash',n:'Efectivo / Débito',cut:0,pay:0,c:'#2f9e44'}];
let S={},tab='home',seg='mes',card=null,cmo=0,ss='res';
function load(){try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}S.cards=S.cards||defCards;S.ex=S.ex||[];S.msi=S.msi||[];S.rec=S.rec||[];S.paid=S.paid||{};S.inc=S.inc||{fix:8257.94,day:15};S.vin=S.vin||[];S.goals=S.goals||[];S.debts=S.debts||[];S.conc=S.conc||{};if(S.cap===undefined)S.cap=3500;S.cats=S.cats||['Comida','Gasolina','Auto','Ropa','Gasto hormiga','Regalo','Cine','Experiencias','Viajes','Videojuegos','Otros'];
if((S.v||1)<2){S.cards.forEach(c=>{if(c.id==='open')c.c='#1c64f2';if(c.id==='bnx')c.c='#1f3470'});S.v=2}
if(!S.incH)S.incH=[{from:'0000-00',fix:S.inc.fix}];
if(S.v<3){const o=S.cats.includes('Otros');S.cats=S.cats.filter(n=>n!=='Otros');['Súper','Suscripciones','Salud','Hogar y Servicios','Transporte','Educación','Cuidado personal'].forEach(n=>{if(!S.cats.includes(n))S.cats.push(n)});if(o)S.cats.push('Otros');S.v=3}
if(!S.cards.some(c=>c.id==='cash'))S.cards.push(defCards[4]);
card=S.last||S.cards[0].id}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}}
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const fd=s=>parse(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const ml=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cd=id=>S.cards.find(c=>c.id===id),sum=L=>L.reduce((a,x)=>a+x.amt,0),cc=()=>S.cards.filter(c=>c.cut),clOf=(d,c)=>c.cut?close(d,c.cut):d;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const cutDate=(y,m,cut)=>new Date(y,m,Math.min(cut,dim(y,m)));
function close(d,cut){let x=cutDate(d.getFullYear(),d.getMonth(),cut);if(d>x)x=cutDate(d.getFullYear(),d.getMonth()+1,cut);return x}
const nextClose=(x,cut)=>cutDate(x.getFullYear(),x.getMonth()+1,cut);
const due=(x,p)=>{const d=new Date(x);d.setDate(d.getDate()+p);return d};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function pcl(p){const c=cd(p.card);if(!c)return[];let cl=close(parse(p.d),c.cut);if(p.next)cl=nextClose(cl,c.cut);const o=[];for(let i=0;i<p.n;i++){o.push(cl);cl=nextClose(cl,c.cut)}return o}
function charges(){const o=[];for(const e of S.ex){const c=cd(e.card);if(!c)continue;o.push({card:e.card,cl:clOf(parse(e.d),c),amt:e.amt,d:e.d,l:e.note||'Gasto',k:'e',id:e.id,cat:e.cat})}
for(const p of S.msi)pcl(p).forEach((cl,i)=>o.push({card:p.card,cl,amt:p.total/p.n,d:iso(cl),l:p.name+' ('+(i+1)+'/'+p.n+')',k:'m',cat:p.cat}));
for(const r of S.rec){const c=cd(r.card);if(!c)continue;const lim=c.cut?close(today(),c.cut):new Date(today().getFullYear(),today().getMonth()+1,0),s0=parse(r.d);for(let i=0;i<240;i++){const y=s0.getFullYear(),m=s0.getMonth()+i,d=new Date(y,m,Math.min(r.day,dim(y,m)));if(d>lim)break;if(d<s0)continue;o.push({card:r.card,cl:clOf(d,c),amt:r.amt,d:iso(d),l:r.name+(d>today()?' (programado)':' (recurrente)'),k:'r',cat:r.cat})}}
return o}
function cycles(){const m={};for(const c of charges()){if(!cd(c.card)?.cut)continue;const k=c.card+'|'+iso(c.cl);(m[k]=m[k]||{k,card:c.card,cl:c.cl,items:[],tot:0});m[k].items.push(c);m[k].tot+=c.amt}return Object.values(m)}
const cdate=c=>c.k==='m'?c.cl:parse(c.d);
function list(L){return L.map(c=>`<div class=row><div><div class=b>${esc(c.l)}</div><div class=s>${fd(c.d)} · ${esc(cd(c.card)?.n||'')}</div></div><div class=b>${fmt(c.amt)}${c.k==='e'?`<button class=x data-act=edit data-id=${c.id}>✎</button>`:''}</div></div>`).join('')}
function byCard(L,t){return S.cards.map(c=>{const s=sum(L.filter(x=>x.card===c.id));return s?`<div style="margin:10px 0 0"><div class=row style="padding:0;border:0"><span>${esc(c.n)}</span><span class=b>${fmt(s)}</span></div><div class=bar style="background:${c.c};width:${Math.max(3,s/t*100)}%"></div></div>`:''}).join('')}

function vHome(){const w=today();w.setDate(w.getDate()-6);const L=S.ex.filter(e=>parse(e.d)>=w).sort((a,b)=>b.t-a.t);
return `<h1>Nuevo gasto</h1>${nextPay()}<div class=card><input id=amt inputmode=decimal placeholder="$0.00" autocomplete=off>
<div class=tiles>${S.cards.map(c=>`<button class="tile${c.id===card?' on':''}" style="background:${c.img?`center/cover url(${c.img})`:c.c}" data-act=pick data-id=${c.id}><span>${esc(c.n)}</span></button>`).join('')}</div>
<div class=s id=hint></div><div class=s id=best style="margin:2px 0 10px"></div>
<input id=note placeholder="Nota (opcional)"><div class=f><select id=cat>${catOpts()}</select><input id=date type=date value="${iso(new Date())}"></div><div style="height:4px"></div>
<button class=btn id=sv data-act=add style="background:${cd(card)?.c||'var(--a)'};color:#fff">Guardar gasto</button></div>
<h2>Esta semana · ${fmt(sum(L))}</h2><div class=card>${L.length?L.map(e=>`<div class=row><div><div class=b>${esc(e.note||cd(e.card)?.n||'Gasto')}</div><div class=s>${fd(e.d)} · ${esc(cd(e.card)?.n||'')}</div></div><div class=b>${fmt(e.amt)}<button class=x data-act=edit data-id=${e.id}>✎</button></div></div>`).join(''):'<div class=s>Aún no hay gastos esta semana. Captura el primero arriba.</div>'}</div>`}
function cyTot(c,d){const k=iso(close(d,c.cut));return cycles().filter(x=>x.card===c.id&&iso(x.cl)===k).reduce((a,x)=>a+x.tot,0)}
function bestCard(dv,extra){const d=dv?parse(dv):today();let b=null,over=0;for(const c of cc()){const tot=cyTot(c,d);if(S.cap&&tot+extra>S.cap){over++;continue}const dd=due(close(d,c.cut),c.pay),n=Math.round((dd-d)/864e5);if(!b||n>b.n)b={c,d:dd,n,tot}}return b||{none:over>0}}
function hint(){const h=$('#hint'),c=cd(card),v=$('#date')?.value,a=parseFloat(($('#amt')?.value||'').replace(/,/g,''))||0;if(!h)return;let t='';
if(c&&v){if(!c.cut)t='Se paga al momento, no genera deuda';else{const cl=close(parse(v),c.cut),tot=cyTot(c,parse(v))+a;t='Entra al corte del '+fd(iso(cl))+' · pagar antes del '+fd(iso(due(cl,c.pay)));if(S.cap&&tot>S.cap)t+=' · ⚠ llegarías a '+fmt(tot)+' (tope '+fmt(S.cap)+')'}}
h.textContent=t;const b=bestCard(v,a);$('#best').textContent=b.none?'Todas las tarjetas pasarían de tu tope de '+fmt(S.cap)+' en este corte':b.c?'Conviene hoy: '+b.c.n+' · pagas el '+fd(iso(b.d))+' ('+b.n+' días) · llevas '+fmt(b.tot)+(S.cap?' de '+fmt(S.cap):''):''}
function nextPay(){const T=today(),y=cycles().filter(x=>x.cl<T&&!S.paid[x.k]&&x.tot>0).map(x=>({x,d:due(x.cl,cd(x.card).pay)})).sort((a,b)=>a.d-b.d)[0];if(!y)return `<div class=s style="margin:-6px 4px 12px">Sin pagos pendientes de tarjeta</div>`;const o=y.d<T;return `<div class=s style="margin:-6px 4px 12px;display:flex;align-items:center;gap:8px"><span data-act=gocut style="flex:1;cursor:pointer">Siguiente pago: <b class="${o?'r':''}">${esc(cd(y.x.card).n)}</b> · ${fmt(y.x.tot)} · ${o?'vencido':'vence'} ${fd(iso(y.d))}</span><button class=pill style="margin:0" data-act=paid data-id="${y.x.k}">Ya pagué</button></div>`}

function vRev(){const sg=`<div class=seg>${[['mes','Mes'],['cut','Por corte'],['cat','Categorías'],['res','Resumen']].map(([k,n])=>`<button class="${seg===k?'on':''}" data-act=seg data-id=${k}>${n}</button>`).join('')}</div>`;return '<h1>Revisar</h1>'+sg+({mes:vMes,cut:vCut,cat:vCat,res:vRes})[seg]()}
function monthL(key){return charges().filter(c=>mk(cdate(c))===key).sort((a,b)=>cdate(b)-cdate(a))}
const capTxt=t=>S.cap?(t>S.cap?` · <span class=r>rebasaste el tope por ${fmt(t-S.cap)}</span>`:` · te quedan ${fmt(S.cap-t)} de tope`):'';
function payDate(x){const v=S.paid[x.k];return typeof v==='string'?v:v?iso(due(x.cl,cd(x.card).pay)):''}
function payList(key){const T=today(),cur=mk(T),o=[];for(const x of cycles()){const c=cd(x.card);if(!c||!c.cut||!(x.tot>0))continue;const d=due(x.cl,c.pay),pd=payDate(x),od=!pd&&key===cur&&mk(d)<key;if((pd?pd.slice(0,7):mk(d))===key||od)o.push({x,c,d,pd,est:x.cl>=T,od})}return o.sort((a,b)=>a.d-b.d)}
function cashBlock(){const key=mk(new Date()),L=monthL(key).filter(c=>!cd(c.card)?.cut);return `<h2>Efectivo / Débito · ${ml(key).split(' ')[0]}</h2><div class=card><div class=row style="border:0;padding:0 0 4px"><span class=s>Se cuenta en tus gastos y categorías</span><span class=b>${fmt(sum(L))}</span></div>${L.length?list(L):'<div class=s>Sin gastos en efectivo o débito este mes.</div>'}</div>`}
function vMes(){const key=mk(new Date()),L=monthL(key),t=sum(L),P=payList(key),pt=P.reduce((a,p)=>a+p.x.tot,0),pp=P.filter(p=>p.pd).reduce((a,p)=>a+p.x.tot,0),cash=sum(L.filter(c=>!cd(c.card)?.cut)),mn=ml(key).split(' ')[0];
const rows=P.map(p=>{const st=p.pd?'Pagado el '+fd(p.pd):p.od?'<span class=r>Venció el '+fd(iso(p.d))+'</span>':'Vence el '+fd(iso(p.d))+(p.est?' · estimado':'');return `<div class=row><div><div class=b>${esc(p.c.n)}</div><div class=s>Corte ${fd(iso(p.x.cl))} · ${st}</div></div><div style="text-align:right"><div class=b>${fmt(p.x.tot)}</div>${p.pd?`<button class=pill data-act=unpaid data-id="${p.x.k}">Deshacer</button>`:!p.est?`<button class=pill data-act=paid data-id="${p.x.k}">Ya pagué</button>`:''}</div></div>`}).join('');
return `<div class=card><div class=s>Gastado en ${ml(key)}</div><div style="font-size:34px;font-weight:700;letter-spacing:-.02em">${fmt(t)}</div>${t?byCard(L,t):''}</div>
<div class=card><div class=s>Pagos de tarjeta de ${mn}</div><div style="font-size:34px;font-weight:700;letter-spacing:-.02em">${fmt(pt)}</div>${P.length?`<div class=s>Pagado ${fmt(pp)} · Pendiente ${fmt(pt-pp)}</div><div style="margin-top:6px">${rows}</div>`:'<div class=s>Ningún corte vence ni se pagó este mes.</div>'}</div>
<div class=s style="padding:0 4px 4px">Dinero que sale en ${mn}: ${fmt(pt+cash)} (pagos de tarjeta + efectivo/débito).</div>
<h2>Movimientos</h2><div class=card>${L.length?list(L):'<div class=s>Sin gastos este mes.</div>'}</div><div class=s style="padding:0 4px">Incluye mensualidades MSI y pagos recurrentes (los programados aún no se han cobrado).</div>`}
function block(x,c,lab,pay){const d=due(x.cl,c.pay),over=pay&&d<today();return `<details class=card><summary><div class=row style="border:0;padding:0"><div><div class=b>${lab} · corte ${fd(iso(x.cl))}</div><div class=s>Pagar antes del ${fd(iso(d))}${over?' <span class=r>· vencido</span>':''}${!pay&&S.cap?capTxt(x.tot):''}</div></div><div class=b>${fmt(x.tot)}</div></div></summary><div style="margin-top:8px">${x.items.length?list(x.items):'<div class=s>Sin gastos en este corte.</div>'}</div>${pay?`<div class=f style="margin-top:10px"><input inputmode=decimal data-ck="${x.k}" placeholder="Total del estado de cuenta" value="${S.conc[x.k]?nf(S.conc[x.k]):''}" style="margin:0"><button class="btn g sm" style="flex:0 0 auto" data-act=conc data-id="${x.k}">Comparar</button></div><div class=s data-cr="${x.k}" style="margin-top:6px">${concTxt(x)}</div><button class="btn g" data-act=paid data-id="${x.k}">Marcar como pagado</button>`:''}</details>`}
function vCut(){const T=today(),cy=cycles();return cc().map(c=>{const cl=close(T,c.cut),cur=cy.find(x=>x.card===c.id&&iso(x.cl)===iso(cl))||{card:c.id,cl,items:[],tot:0},old=cy.filter(x=>x.card===c.id&&x.cl<T&&!S.paid[x.k]).sort((a,b)=>b.cl-a.cl);
return `<h2 style="color:${c.c}">${esc(c.n)}</h2>`+block(cur,c,'En curso',false)+old.map(x=>block(x,c,'Por pagar',true)).join('')}).join('')+cashBlock()}
function vRes(){const cy=cycles(),T=today();let debt=0;
const dl=cc().map(c=>{const k=iso(close(T,c.cut)),op=sum(cy.filter(x=>x.card===c.id&&iso(x.cl)===k).map(x=>({amt:x.tot}))),pd=sum(cy.filter(x=>x.card===c.id&&x.cl<T&&!S.paid[x.k]).map(x=>({amt:x.tot})));debt+=op+pd;return `<div class=row><div><div class=b>${esc(c.n)}</div><div class=s>Por pagar ${fmt(pd)} · en curso ${fmt(op)}</div></div><div class=b>${fmt(op+pd)}</div></div>`}).join('');
const cur=mk(T),keys=[...new Set(charges().map(c=>mk(cdate(c))))].filter(k=>k<=cur).sort().reverse();
return `<div class=card><div class=s>Deuda hasta el momento</div><div style="font-size:34px;font-weight:700;letter-spacing:-.02em" class=${debt?'r':''}>${fmt(debt)}</div>${dl}</div>`+bars()+keys.map((k,i)=>{const L=monthL(k),t=sum(L);return `<details class=card ${i<2?'open':''}><summary><div class=row style="border:0;padding:0"><div class=b>${ml(k)}${k===cur?' (en curso)':''}</div><div class=b>${fmt(t)}</div></div></summary>${byCard(L,t)}</details>`}).join('')||'<div class=s>Todavía no hay datos para resumir.</div>'}

function vMsi(){const T=today();let mo=0,nx=null;const A=[],F=[];
for(const p of S.msi){const cl=pcl(p),last=cl[cl.length-1],o={p,billed:cl.filter(x=>x<T).length,m:p.total/p.n,last};if(last&&last<T)F.push(o);else{A.push(o);mo+=o.m;if(last&&(!nx||last<nx.last))nx=o}}

function vPers(){const rem=x=>x.amt-sum(x.pays),O=S.debts.filter(x=>rem(x)>0.005),F=S.debts.filter(x=>rem(x)<=0.005),me=O.filter(x=>x.dir==='me').reduce((a,x)=>a+rem(x),0),yo=O.filter(x=>x.dir==='yo').reduce((a,x)=>a+rem(x),0);

function calcBuy(){const a=parseFloat($('#ba').value.replace(/,/g,'')),c=cd($('#bc').value),n=Math.max(0,parseInt($('#bm').value)||0),dv=$('#bd').value||iso(new Date());if(!(a>0)||!c)return toast('Escribe el precio');
const T=today(),cur=mk(T),d=parse(dv),msi=n>=2&&c.cut,cy=cycles(),mon=msi?a/n:a,net=fixAt(cur)+vinAt(cur)-sum(monthL(cur));
let first=d,last=d;if(c.cut){first=close(d,c.cut);last=first;if(msi)for(let i=1;i<n;i++)last=nextClose(last,c.cut)}
const imp=mk(msi?first:d)===cur?mon:0,after=net-imp,warn=imp>0&&imp>Math.max(net,0)*.5,col=after<0?'var(--r)':warn?'#e67700':'var(--a)',msg=after<0?'Te dejaría en negativo este mes':warn?'Usaría más de la mitad de tu ahorro del mes':'Cabe en tu mes',R=[];
let capOver=false;
if(c.cut){const dd=due(first,c.pay),bef=sum(cy.filter(x=>x.card===c.id&&iso(x.cl)===iso(first)).map(x=>({amt:x.tot})));R.push(`Entra al corte del ${fd(iso(first))} · pagas antes del ${fd(iso(dd))} (${Math.round((dd-d)/864e5)} días)`);R.push(`${c.n} en ese corte: ${fmt(bef)} → ${fmt(bef+mon)}`);if(S.cap){capOver=bef+mon>S.cap;R.push(capOver?'⚠ Rebasaría tu tope de '+fmt(S.cap)+' por '+fmt(bef+mon-S.cap):'Quedaría dentro de tu tope de '+fmt(S.cap))}
const b=cc().map(k=>({k,dd:due(close(d,k.cut),k.pay)})).sort((x,y)=>y.dd-x.dd)[0];if(b&&b.k.id!==c.id)R.push(`Con ${b.k.n} pagarías hasta el ${fd(iso(b.dd))}, más tarde`)}else R.push('Se paga al momento, no genera deuda');
if(msi){const mo=S.msi.reduce((s0,p)=>{const cl=pcl(p),l=cl[cl.length-1];return s0+(l&&l>=T?p.total/p.n:0)},0);R.push(`Mensualidad de ${fmt(mon)} por ${n} meses · último cobro en el corte del ${fd(iso(last))}`);R.push(`Tus MSI activos pasarían de ${fmt(mo)} a ${fmt(mo+mon)} al mes`)}
R.push(imp>0?`Ahorro de este mes: ${fmt(net)} → ${fmt(after)}`:`No cambia tu ahorro de este mes (cae en ${ml(mk(msi?first:d))})`);

$('#buyres').innerHTML=`<div class=card><div class=b style="font-size:17px;color:${capOver&&msg==='Cabe en tu mes'?'#e67700':col}">${capOver&&msg==='Cabe en tu mes'?'Cabe en tu mes, pero rebasa tu tope por corte':msg}</div>${R.map(t=>`<div class=row><span>${t}</span></div>`).join('')}<div class=s style="margin-top:6px">Usa lo que ya ingresó este mes. Es una estimación, no un consejo financiero.</div></div>`}
